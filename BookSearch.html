<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search List - Eric Howard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .animate-pulse-slow { animation: pulse-slow 8s infinite; }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-pink-500/20 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-500/20 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <div class="relative z-10 p-6 md:p-10 max-w-4xl mx-auto flex flex-col min-h-screen">
        <a href="Project.html" class="text-pink-400 hover:text-pink-300 transition-colors mb-6 inline-block font-medium">← Back to Projects</a>
        
        <header class="mb-8 border-b border-white/10 pb-6">
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-pink-400 to-blue-600 bg-clip-text text-transparent mb-3">
                Book Search List
            </h1>
            <p class="text-gray-400 italic">
                Source: SearchBook.json
            </p>
        </header>

        <main id="results-list" class="flex flex-col gap-6 flex-grow">
            <div id="loading-msg" class="text-pink-400 italic animate-pulse">Fetching search results...</div>
        </main>

        <footer class="py-10 text-center text-gray-500 mt-10">
            <p>© 2026 IT 4403 Course Project</p>
        </footer>
    </div>

    <script>
        $(document).ready(function() {
            
            const jsonUrl = "SearchBook.json?nocache=" + new Date().getTime();

            $.getJSON(jsonUrl, function(data) {
                $("#results-list").empty();

                if (!data.items) {
                    $("#results-list").html("<p class='text-red-400'>No results found.</p>");
                    return;
                }

                $.each(data.items, function(i, item) {
                    const info = item.volumeInfo;
                    const access = item.accessInfo || {};
                    
                    let thumb = info.imageLinks ? info.imageLinks.thumbnail : "https://via.placeholder.com/150x200?text=No+Cover";
                    thumb = thumb.replace("http:", "https:"); 
                    
                    const title = info.title || "No Title";
                    const authors = info.authors ? info.authors.join(", ") : "N/A";
                    const publisher = info.publisher || "N/A";
                    const publishedDate = info.publishedDate || "N/A";
                    const language = info.language || "N/A";
                    const printType = info.printType || "N/A";
                    const desc = info.description || "No description available.";
                    
                    
                    const previewLink = info.previewLink || "#";
                    const webReaderLink = access.webReaderLink || "#";
                    const apiLink = item.selfLink || "#";
                    
                    const cardHtml = `
                        <div class="bg-gray-900/60 backdrop-blur-xl border border-white/10 rounded-2xl p-6 shadow-xl hover:border-pink-500/30 transition-all flex flex-col sm:flex-row gap-6">
                            
                            <div class="flex-shrink-0 mx-auto sm:mx-0">
                                <img src="${thumb}" alt="Book Cover" class="w-32 sm:w-40 object-cover rounded shadow-lg shadow-black/50 border border-white/10">
                            </div>

                            <div class="flex-grow text-gray-300">
                                <h2 class="text-2xl font-bold text-white mb-3">${title}</h2>
                                
                                <p class="mb-1"><strong class="text-gray-100">Authors:</strong> ${authors}</p>
                                <p class="mb-1"><strong class="text-gray-100">Publisher:</strong> ${publisher}</p>
                                <p class="mb-1"><strong class="text-gray-100">Published:</strong> ${publishedDate}</p>
                                <p class="mb-4"><strong class="text-gray-100">Language:</strong> ${language} &bull; <strong class="text-gray-100">Print:</strong> ${printType}</p>
                                
                                <p class="text-sm leading-relaxed text-gray-400 mb-6">${desc}</p>
                                
                                <div class="flex flex-wrap gap-2 mt-auto">
                                    <a href="${previewLink}" target="_blank" class="px-4 py-2 border border-pink-600/50 bg-pink-600/10 rounded-lg hover:bg-pink-600/30 hover:border-pink-400 transition-colors text-sm font-medium text-pink-300">Preview</a>
                                    <a href="${webReaderLink}" target="_blank" class="px-4 py-2 border border-blue-600/50 bg-blue-600/10 rounded-lg hover:bg-blue-600/30 hover:border-blue-400 transition-colors text-sm font-medium text-blue-300">Web Reader</a>
                                    <a href="${apiLink}" target="_blank" class="px-4 py-2 border border-purple-600/50 bg-purple-600/10 rounded-lg hover:bg-purple-600/30 hover:border-purple-400 transition-colors text-sm font-medium text-purple-300">API</a>
                                </div>
                            </div>

                        </div>
                    `;
                    $("#results-list").append(cardHtml);
                });
            }).fail(function(jqXHR, textStatus, errorThrown) {
                $("#results-list").html(`
                    <div class="bg-red-900/30 border-l-4 border-red-500 p-6 rounded-lg">
                        <h3 class="text-red-400 font-bold mb-2">Error:</h3>
                        <p class="text-gray-300">Status: ${textStatus}</p>
                    </div>
                `);
            });
        });
    </script>
</body>
</html>
