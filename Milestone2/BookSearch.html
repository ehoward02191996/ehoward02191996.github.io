<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search - Milestone 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <a href="BookSearch.html">Home (Search)</a>
        <a href="Bookshelf.html">My Bookshelf</a>
    </nav>

    <div class="container">
        <div id="search-section">
            <h1>Google Books Search</h1>
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="Search...">
                <button id="search-btn">Search</button>
            </div>
            <div class="pagination" id="pagination-controls" style="display:none; justify-content:center; gap:10px; margin-bottom:20px;">
                <label>Page:</label>
                <select id="page-select">
                    <option value="0">1</option>
                    <option value="12">2</option>
                    <option value="24">3</option>
                    <option value="36">4</option>
                    <option value="48">5</option>
                </select>
            </div>
            <div id="status-msg" style="text-align:center; color:#9ca3af; margin-bottom:20px;">Enter a keyword.</div>
            <main class="grid" id="results-grid"></main>
        </div>

        <div id="details-section" style="display:none;">
            <button onclick="window.location.href='BookSearch.html'" style="margin-bottom:20px;">Back</button>
            <div id="book-info" class="card" style="display:flex; flex-direction:row; text-align:left; gap:20px; padding:20px;">
                <img id="book-cover" src="" style="width:200px; height:auto;">
                <div>
                    <h2 id="book-title"></h2>
                    <p id="book-authors"></p>
                    <p id="book-publisher"></p>
                    <p id="book-price"></p>
                    <hr style="margin:10px 0;">
                    <p id="book-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getBooks(query, startIndex = 0) {
            const status = document.getElementById('status-msg');
            const grid = document.getElementById('results-grid');
            const pagination = document.getElementById('pagination-controls');

            if (!query) return;

            status.innerText = "Connecting to Google...";
            grid.innerHTML = "";

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&startIndex=${startIndex}&maxResults=12`);
                
                if (response.status === 429) {
                    status.innerText = "Google is busy. Please wait 60 seconds and try again.";
                    return;
                }

                const data = await response.json();

                if (!data.items) {
                    status.innerText = "No books found.";
                    return;
                }

                status.innerText = "";
                pagination.style.display = "flex";

                data.items.forEach(item => {
                    const v = item.volumeInfo;
                    const img = v.imageLinks ? v.imageLinks.thumbnail.replace("http:", "https:") : "https://via.placeholder.com/128x192";
                    const card = document.createElement('div');
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${img}">
                        <a href="BookSearch.html?id=${item.id}">${v.title}</a>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                status.innerText = "Connection failed. Check your internet.";
                console.error(error);
            }
        }

        $(document).ready(function() {
            const params = new URLSearchParams(window.location.search);
            const bid = params.get('id');

            if (bid) {
                $("#search-section").hide();
                $("#details-section").show();
                fetch(`https://www.googleapis.com/books/v1/volumes/${bid}`)
                    .then(res => res.json())
                    .then(d => {
                        const v = d.volumeInfo;
                        $("#book-cover").attr("src", v.imageLinks ? v.imageLinks.thumbnail.replace("http:", "https:") : "");
                        $("#book-title").text(v.title);
                        $("#book-authors").text(v.authors ? v.authors.join(", ") : "Unknown Author");
                        $("#book-publisher").text(v.publisher || "Unknown Publisher");
                        $("#book-description").html(v.description || "No description.");
                        $("#book-info").show();
                    });
            } else {
                $("#search-btn").click(() => getBooks($("#search-input").val()));
                $("#page-select").change(function() {
                    getBooks($("#search-input").val(), $(this).val());
                });
            }
        });
    </script>
</body>
</html>
