<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search - Milestone 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <a href="BookSearch.html">Home (Search)</a>
        <a href="Bookshelf.html">My Bookshelf</a>
    </nav>

    <div class="container">
        <div id="search-section">
            <h1>Google Books Search</h1>
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="Search...">
                <button id="search-btn">Search</button>
            </div>
            <div class="pagination" id="pagination-controls" style="display:none; justify-content:center; gap:10px; margin-bottom:20px;">
                <label>Page:</label>
                <select id="page-select">
                    <option value="0">1</option>
                    <option value="12">2</option>
                    <option value="24">3</option>
                    <option value="36">4</option>
                    <option value="48">5</option>
                </select>
            </div>
            <div id="status-msg" style="text-align:center; color:#9ca3af; margin-bottom:20px;">Enter a keyword.</div>
            <main class="grid" id="results-grid"></main>
        </div>

        <div id="details-section" style="display:none;">
            <button onclick="window.location.href='BookSearch.html'" style="margin-bottom:20px;">Back</button>
            <div id="book-info" class="card" style="display:flex; flex-direction:row; text-align:left; gap:20px; padding:20px;">
                <img id="book-cover" src="" style="width:200px; height:auto;">
                <div>
                    <h2 id="book-title"></h2>
                    <p id="book-authors"></p>
                    <p id="book-publisher"></p>
                    <p id="book-price"></p>
                    <hr style="margin:10px 0;">
                    <p id="book-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const params = new URLSearchParams(window.location.search);
            const bid = params.get('id');

            if (bid) {
                $("#search-section").hide();
                $("#details-section").show();
                $.getJSON(`https://www.googleapis.com/books/v1/volumes/${bid}`, function(d) {
                    const v = d.volumeInfo;
                    $("#book-cover").attr("src", v.imageLinks ? v.imageLinks.thumbnail : "");
                    $("#book-title").text(v.title);
                    $("#book-authors").text(v.authors ? v.authors.join(", ") : "");
                    $("#book-publisher").text(v.publisher || "");
                    $("#book-description").html(v.description || "");
                    $("#book-info").show();
                });
            } else {
                $("#search-btn").click(function() {
                    searchBooks(0);
                });

                $("#page-select").change(function() {
                    searchBooks($(this).val());
                });

                function searchBooks(index) {
                    const q = $("#search-input").val();
                    if(!q) return;
                    $("#status-msg").text("Searching...");
                    $.getJSON(`https://www.googleapis.com/books/v1/volumes?q=${q}&startIndex=${index}&maxResults=12`, function(data) {
                        $("#results-grid").empty();
                        if(!data.items) {
                            $("#status-msg").text("No results.");
                            return;
                        }
                        $("#pagination-controls").show();
                        $("#status-msg").text("");
                        $.each(data.items, function(i, item) {
                            const v = item.volumeInfo;
                            const img = v.imageLinks ? v.imageLinks.thumbnail : "https://via.placeholder.com/128x192";
                            $("#results-grid").append(`
                                <div class="card">
                                    <img src="${img}">
                                    <a href="BookSearch.html?id=${item.id}">${v.title}</a>
                                </div>
                            `);
                        });
                    }).fail(function() {
                        $("#status-msg").text("Google API Limit Reached. Wait 5 minutes.");
                    });
                }
            }
        });
    </script>
</body>
</html>
