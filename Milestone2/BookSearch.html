<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search - Milestone 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <a href="BookSearch.html">Home (Search)</a>
        <a href="Bookshelf.html">My Bookshelf</a>
    </nav>

    <div class="container">
        
        <div id="search-section">
            <h1>Google Books Search</h1>
            
            <div class="search-controls">
                <input type="text" id="search-input" placeholder="Enter keyword (e.g., HTML, Space, Cooking)">
                <button id="search-btn">Search</button>
            </div>

            <div class="pagination" id="pagination-controls">
                <label for="page-select" style="color: #9ca3af;">Select Page:</label>
                <select id="page-select">
                    <option value="1">Page 1 (1-12)</option>
                    <option value="2">Page 2 (13-24)</option>
                    <option value="3">Page 3 (25-36)</option>
                    <option value="4">Page 4 (37-48)</option>
                    <option value="5">Page 5 (49-60)</option>
                </select>
            </div>

            <div id="status-msg" style="text-align: center; color: #9ca3af; margin-bottom: 2rem;">
                Type a keyword above to begin your search.
            </div>

            <main class="grid" id="results-grid"></main>
        </div>

        <div id="details-section" style="display: none;">
            <a href="BookSearch.html" style="color: var(--accent-blue); text-decoration: none; display: inline-block; margin-bottom: 1rem;">&larr; Back to Search</a>
            
            <div id="loading-details-msg" style="text-align: center; color: var(--accent-pink); font-style: italic; font-size: 1.2rem;">
                Loading book details...
            </div>

            <div id="book-info" style="display: none; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 1rem; padding: 2rem; gap: 2rem; flex-wrap: wrap;">
