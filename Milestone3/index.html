<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer SPA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <button id="nav-search">Search Books</button>
        <button id="nav-shelf">My Bookshelf</button>
    </nav>

    <div class="container">
        <section id="search-ui">
            <h1>Search Google Books</h1>
            <div class="search-controls">
                <input type="text" id="query" placeholder="Search for books...">
                <button id="exec-search">Search</button>
            </div>
            
            <div id="page-nav" style="display:none; justify-content:center; gap:10px; margin-bottom:20px;">
                <button class="pg-btn" data-page="0">1</button>
                <button class="pg-btn" data-page="10">2</button>
                <button class="pg-btn" data-page="20">3</button>
                <button class="pg-btn" data-page="30">4</button>
                <button class="pg-btn" data-page="40">5</button>
            </div>
        </section>

        <section id="shelf-ui" style="display:none;">
            <h1>My Collection</h1>
        </section>

        <div id="main-display">
            <div id="status"></div>
            <div id="results-grid" class="grid"></div>
        </div>

        <section id="details-view" style="display:none; margin-top:40px; padding:20px; background:rgba(255,255,255,0.05); border-radius:15px;">
            <div style="display:flex; gap:30px; flex-wrap:wrap;">
                <img id="det-img" src="" style="width:200px; border-radius:10px;">
                <div style="flex:1; min-width:300px;">
                    <h2 id="det-title"></h2>
                    <p id="det-author" style="color: #ec4899; margin-bottom:10px;"></p>
                    <p id="det-desc" style="line-height:1.6; color:#9ca3af;"></p>
                </div>
            </div>
        </section>
    </div>

    <script>
        $(document).ready(function() {
            let currentTerm = "";
            const shelfIds = ["Wfan6L9RGgYC", "7vW9s-w0lT8C", "OP1sDwAAQBAJ", "yN_cCwAAQBAJ", "p1v6DwAAQBAJ", "9H6xDwAAQBAJ"];

            function showDetails(id) {
                $("#details-view").hide();
                $.getJSON(`https://www.googleapis.com/books/v1/volumes/${id}`, function(data) {
                    const info = data.volumeInfo;
                    $("#det-img").attr("src", info.imageLinks ? info.imageLinks.thumbnail : "");
                    $("#det-title").text(info.title);
                    $("#det-author").text(info.authors ? "By " + info.authors.join(", ") : "Unknown Author");
                    $("#det-desc").html(info.description || "No description available.");
                    $("#details-view").fadeIn();
                    $('html, body').animate({ scrollTop: $("#details-view").offset().top }, 500);
                });
            }

            function runSearch(start) {
                currentTerm = $("#query").val();
                if(!currentTerm) return;
                $("#status").text("Searching...");
                $("#results-grid").empty();
                
                $.ajax({
                    url: `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(currentTerm)}&startIndex=${start}&maxResults=10`,
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        $("#page-nav").css("display", "flex");
                        if(!data.items) return;
                        $.each(data.items, function(i, item) {
                            const v = item.volumeInfo;
                            const img = v.imageLinks ? v.imageLinks.thumbnail : "https://via.placeholder.com/128x192";
                            const card = $(`<div class="card"><img src="${img}"><p class="book-link" data-id="${item.id}">${v.title}</p></div>`);
                            $("#results-grid").append(card);
                        });
                    }
                });
            }

            $("#exec-search").click(() => runSearch(0));
            
            $(".pg-btn").click(function() {
                $(".pg-btn").css("background", "");
                $(this).css("background", "#ec4899");
                runSearch($(this).data("page"));
            });

            $(document).on("click", ".book-link", function() {
                showDetails($(this).data("id"));
            });

            $("#nav-shelf").click(function() {
                $("#search-ui, #page-nav").hide();
                $("#shelf-ui").show();
                $("#results-grid").empty();
                $("#status").text("Loading Shelf...");
                
                shelfIds.forEach(id => {
                    $.getJSON(`https://www.googleapis.com/books/v1/volumes/${id}`, function(item) {
                        const v = item.volumeInfo;
                        const card = $(`<div class="card"><img src="${v.imageLinks.thumbnail}"><p class="book-link" data-id="${item.id}">${v.title}</p></div>`);
                        $("#results-grid").append(card);
                    });
                });
                $("#status").text("");
            });

            $("#nav-search").click(function() {
                $("#shelf-ui").hide();
                $("#search-ui").show();
                $("#results-grid").empty();
                $("#details-view").hide();
            });
        });
    </script>
</body>
</html>
