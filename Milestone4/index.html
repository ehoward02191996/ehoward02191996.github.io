<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer SPA - Milestone 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.2.0/mustache.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <button id="nav-search">Search Movies</button>
        <button id="nav-shelf">Popular Movies</button>
        <span style="margin-left: 20px; color: #9ca3af;">Layout:</span>
        <button id="btn-grid" style="background: #3b82f6;">Grid</button>
        <button id="btn-list">List</button>
    </nav>

    <div class="container">
        <section id="search-ui">
            <h1>Movie Search</h1>
            <div class="search-controls">
                <input type="text" id="query" placeholder="Search for movies...">
                <button id="exec-search">Search</button>
            </div>
            
            <div id="page-nav" style="display:none; justify-content:center; align-items:center; gap:15px; margin-bottom:20px;">
                <button id="prev-page" class="nav-btn">← Prev</button>
                <span style="color: #ec4899; font-weight: bold;">Page <span id="current-page-num">1</span></span>
                <button id="next-page" class="nav-btn">Next →</button>
            </div>
        </section>

        <section id="shelf-ui" style="display:none;">
            <h1>Trending & Popular</h1>
        </section>

        <div id="main-display">
            <div id="status" style="text-align:center; color:#ec4899; margin-bottom:20px;"></div>
            <div id="results-container" class="grid-view"></div>
        </div>

        <section id="details-view" style="display:none; margin-top:40px; padding:20px; background:rgba(255,255,255,0.05); border-radius:15px; border: 1px solid rgba(255,255,255,0.1);">
        </section>
    </div>

    <script id="movie-card-template" type="text/template">
        {{#results}}
        <div class="card movie-card">
            <img src="{{#poster_path}}https://image.tmdb.org/t/p/w200{{poster_path}}{{/poster_path}}{{^poster_path}}https://via.placeholder.com/200x300?text=No+Poster{{/poster_path}}" alt="Poster">
            <div class="card-info">
                <p class="book-trigger" style="color:#3b82f6; cursor:pointer; font-weight:bold; font-size: 1.1rem;" data-id="{{id}}">{{title}}</p>
                <p style="font-size: 0.85rem; color: #9ca3af;" class="list-only-text">Released: {{release_date}} | Rating: {{vote_average}}/10</p>
            </div>
        </div>
        {{/results}}
        {{^results}}
        <p style="color: white; text-align: center;">No movies found.</p>
        {{/results}}
    </script>

    <script id="movie-detail-template" type="text/template">
        <div style="display:flex; gap:30px; flex-wrap:wrap; position: relative;">
            <button id="close-details" style="position: absolute; top: 0; right: 0; background: none; color: #ec4899; border: none; cursor: pointer; font-size: 1.2rem;">✖</button>
            <img src="{{#poster_path}}https://image.tmdb.org/t/p/w300{{poster_path}}{{/poster_path}}{{^poster_path}}https://via.placeholder.com/300x450?text=No+Poster{{/poster_path}}" style="width:200px; border-radius:10px;">
            <div style="flex:1; min-width:300px;">
                <h2 style="font-size:2rem; margin-bottom:5px;">{{title}}</h2>
                <p style="color: #ec4899; font-weight:bold; margin-bottom:15px;">Rating: {{vote_average}}/10 | Runtime: {{runtime}} min</p>
                <p style="margin-bottom:15px; font-style: italic; color: #d1d5db;">{{tagline}}</p>
                <p style="line-height:1.6; color:#9ca3af;">{{overview}}</p>
                <p style="margin-top: 15px; font-size: 0.9rem; color: #6b7280;">Genres: 
                    {{#genres}} <span style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; margin-right: 5px;">{{name}}</span> {{/genres}}
                </p>
            </div>
        </div>
    </script>

    <script>
        $(document).ready(function() {
            var tmdbKey = "62f64973d12e23168dc7804762b4e18c"; 
            
            var currentPage = 1;
            var currentSearchTerm = "";

            function renderResults(data) {
                var rawTemplate = $("#movie-card-template").html();
                var compiledHtml = Mustache.render(rawTemplate, data);
                $("#results-container").html(compiledHtml);
            }

            function renderDetails(data) {
                var rawTemplate = $("#movie-detail-template").html();
                var compiledHtml = Mustache.render(rawTemplate, data);
                $("#details-view").html(compiledHtml);
                
                $("#details-view").fadeIn();
                $('html, body').animate({ scrollTop: $("#details-view").offset().top }, 500);
            }

            function getMovieDetails(id) {
                $("#status").text("Loading...");
                var fetchUrl = "https://api.themoviedb.org/3/movie/" + id + "?api_key=" + tmdbKey;
                
                $.ajax({
                    url: fetchUrl,
                    method: 'GET',
                    success: function(response) {
                        $("#status").text("");
                        renderDetails(response);
                    },
                    error: function() {
                        $("#status").text("Error pulling details.");
                    }
                });
            }

            function executeSearch(page) {
                var term = $("#query").val();
                if(term === "") return;
                
                currentSearchTerm = term;
                currentPage = page;
                
                $("#status").text("Searching...");
                $("#results-container").empty();
                $("#details-view").hide();
                
                var searchUrl = "https://api.themoviedb.org/3/search/movie?api_key=" + tmdbKey + "&query=" + encodeURIComponent(term) + "&page=" + page;
                
                $.ajax({
                    url: searchUrl,
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        $("#page-nav").css("display", "flex");
                        $("#current-page-num").text(currentPage);
                        $("#prev-page").prop("disabled", currentPage === 1).css("opacity", currentPage === 1 ? "0.3" : "1");
                        
                        renderResults(data);
                    }
                });
            }

            function loadPopular() {
                $("#status").text("Loading...");
                $("#results-container").empty();
                $("#details-view").hide();
                
                var popUrl = "https://api.themoviedb.org/3/movie/popular?api_key=" + tmdbKey + "&page=1";
                
                $.ajax({
                    url: popUrl,
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        renderResults(data);
                    }
                });
            }

            $("#exec-search").click(function() { 
                executeSearch(1); 
            });

            $("#next-page").click(function() {
                executeSearch(currentPage + 1);
            });
            
            $("#prev-page").click(function() {
                if(currentPage > 1) {
                    executeSearch(currentPage - 1);
                }
            });

            $(document).on("click", ".book-trigger", function() {
                getMovieDetails($(this).data("id"));
            });
            
            $(document).on("click", "#close-details", function() {
                $("#details-view").fadeOut();
            });

            $("#btn-grid").click(function() {
                $(this).css("background", "#3b82f6");
                $("#btn-list").css("background", "none");
                $("#results-container").removeClass("list-view").addClass("grid-view");
                $(".list-only-text").hide();
                
                $("#results-container").css({
                    "display": "",
                    "flex-direction": "",
                    "gap": ""
                });
                $(".movie-card").css({
                    "display": "",
                    "flex-direction": "",
                    "align-items": "",
                    "text-align": "",
                    "gap": ""
                });
                $(".movie-card img").css("width", "");
            });

            $("#btn-list").click(function() {
                $(this).css("background", "#3b82f6");
                $("#btn-grid").css("background", "none");
                $("#results-container").removeClass("grid-view").addClass("list-view");
                $(".list-only-text").show();
                
                $("#results-container").css({
                    "display": "flex",
                    "flex-direction": "column",
                    "gap": "15px"
                });
                $(".movie-card").css({
                    "display": "flex",
                    "flex-direction": "row",
                    "align-items": "center",
                    "text-align": "left",
                    "gap": "20px"
                });
                $(".movie-card img").css("width", "100px");
            });

            $("#nav-shelf").click(function() {
                $("#search-ui, #page-nav, #details-view").hide();
                $("#shelf-ui").show();
                loadPopular();
            });

            $("#nav-search").click(function() {
                $("#shelf-ui").hide();
                $("#search-ui").show();
                $("#results-container").empty();
                $("#page-nav, #details-view").hide();
                $("#query").val("");
            });
        });
    </script>
</body>
</html>
