<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Explorer SPA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav>
        <button id="nav-search">Search Books</button>
        <button id="nav-shelf">My Collection</button>
    </nav>

    <div class="container">
        <section id="search-ui">
            <h1>Book Search</h1>
            <div class="search-controls">
                <input type="text" id="query" placeholder="Search for books...">
                <button id="exec-search">Search</button>
            </div>
            
            <div id="page-nav" style="display:none; justify-content:center; gap:10px; margin-bottom:20px;">
                <button class="pg-btn" data-page="0">1</button>
                <button class="pg-btn" data-page="10">2</button>
                <button class="pg-btn" data-page="20">3</button>
                <button class="pg-btn" data-page="30">4</button>
                <button class="pg-btn" data-page="40">5</button>
            </div>
        </section>

        <section id="shelf-ui" style="display:none;">
            <h1>My Personal Picks</h1>
        </section>

        <div id="main-display">
            <div id="status" style="text-align:center; color:#ec4899; margin-bottom:20px;"></div>
            <div id="results-grid" class="grid"></div>
        </div>

        <section id="details-view" style="display:none; margin-top:40px; padding:20px; background:rgba(255,255,255,0.05); border-radius:15px; border: 1px solid rgba(255,255,255,0.1);">
            <div style="display:flex; gap:30px; flex-wrap:wrap;">
                <img id="det-img" src="" style="width:200px; border-radius:10px;">
                <div style="flex:1; min-width:300px;">
                    <h2 id="det-title" style="font-size:2rem; margin-bottom:10px;"></h2>
                    <p id="det-author" style="color: #ec4899; font-weight:bold; margin-bottom:15px;"></p>
                    <p id="det-desc" style="line-height:1.6; color:#9ca3af;"></p>
                </div>
            </div>
        </section>
    </div>

    <script>
        $(document).ready(function() {
            const myApiKey = "AIzaSyATg4DGcuKTgHmrHe5P_gk_5In_1qvC3Uo"; 
            const myCollectionIds = ["1Zp8AwAAQBAJ", "W56_AwAAQBAJ", "q_YpDAAAQBAJ", "rj9JDAAAQBAJ", "7vW9s-w0lT8C", "Wfan6L9RGgYC"];

            function getBookDetails(id) {
                $("#status").text("Fetching details...");
                $.ajax({
                    url: "https://www.googleapis.com/books/v1/volumes/" + id + "?key=" + myApiKey,
                    method: 'GET',
                    success: function(data) {
                        const info = data.volumeInfo;
                        const img = info.imageLinks ? info.imageLinks.thumbnail.replace("http:", "https:") : "https://via.placeholder.com/200x300";
                        $("#det-img").attr("src", img);
                        $("#det-title").text(info.title);
                        $("#det-author").text(info.authors ? "Author: " + info.authors.join(", ") : "Unknown Author");
                        $("#det-desc").html(info.description || "No description provided.");
                        $("#status").text("");
                        $("#details-view").fadeIn();
                        $('html, body').animate({ scrollTop: $("#details-view").offset().top }, 500);
                    }
                });
            }

            function performSearch(startIndex) {
                const term = $("#query").val();
                if(!term) return;
                $("#status").text("Searching...");
                $("#results-grid").empty();
                $("#details-view").hide();
                $.ajax({
                    url: "https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(term) + "&startIndex=" + startIndex + "&maxResults=10&key=" + myApiKey,
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        $("#page-nav").css("display", "flex");
                        if(!data.items) { $("#status").text("No results found."); return; }
                        $.each(data.items, function(i, item) {
                            const v = item.volumeInfo;
                            const img = v.imageLinks ? v.imageLinks.thumbnail.replace("http:", "https:") : "https://via.placeholder.com/128x192";
                            const card = $('<div class="card"><img src="' + img + '"><p class="book-trigger" style="color:#3b82f6; cursor:pointer; font-weight:bold;" data-id="' + item.id + '">' + v.title + '</p></div>');
                            $("#results-grid").append(card);
                        });
                    }
                });
            }

            $("#exec-search").click(function() { performSearch(0); });
            
            $(".pg-btn").click(function() {
                $(".pg-btn").css("background", "none");
                $(this).css("background", "#ec4899");
                performSearch($(this).data("page"));
            });

            $(document).on("click", ".book-trigger", function() {
                getBookDetails($(this).data("id"));
            });

            $("#nav-shelf").click(function() {
                $("#search-ui, #page-nav, #details-view").hide();
                $("#shelf-ui").show();
                $("#results-grid").empty();
                $("#status").text("Loading Collection...");
                
                myCollectionIds.forEach(function(id) {
                    $.ajax({
                        url: "https://www.googleapis.com/books/v1/volumes/" + id + "?key=" + myApiKey,
                        method: 'GET',
                        success: function(item) {
                            const v = item.volumeInfo;
                            const img = v.imageLinks ? v.imageLinks.thumbnail.replace("http:", "https:") : "https://via.placeholder.com/128x192";
                            const card = $('<div class="card"><img src="' + img + '"><p class="book-trigger" style="color:#3b82f6; cursor:pointer; font-weight:bold;" data-id="' + item.id + '">' + v.title + '</p></div>');
                            $("#results-grid").append(card);
                        }
                    });
                });
                $("#status").text("");
            });

            $("#nav-search").click(function() {
                $("#shelf-ui").hide();
                $("#search-ui").show();
                $("#results-grid").empty();
                $("#page-nav, #details-view").hide();
            });
        });
    </script>
</body>
</html>
