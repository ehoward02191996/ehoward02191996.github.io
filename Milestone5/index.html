<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch SPA - Bootstrap Edition</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.2.1/mustache.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="text-light">
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4 shadow">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="#">🎥 CineSearch</a>
            
            <div class="d-flex align-items-center">
                <span class="text-secondary me-2 d-none d-sm-inline">Layout:</span>
                <div class="btn-group" role="group">
                    <button type="button" id="btn-grid" class="btn btn-primary btn-sm">Grid</button>
                    <button type="button" id="btn-list" class="btn btn-outline-primary btn-sm">List</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-pills mb-4 justify-content-center" id="appTabs">
            <li class="nav-item">
                <button class="nav-link active bg-primary" id="nav-search">Search Movies</button>
            </li>
            <li class="nav-item ms-2">
                <button class="nav-link text-light border border-secondary" id="nav-shelf">Popular / Trending</button>
            </li>
        </ul>

        <div id="search-section" class="mb-4">
            <div class="row justify-content-center mb-3">
                <div class="col-md-8 col-lg-6">
                    <div class="input-group input-group-lg shadow-sm">
                        <input type="text" id="query" class="form-control bg-dark text-light border-secondary" placeholder="Search for movies...">
                        <button class="btn btn-primary px-4" id="exec-search">Search</button>
                    </div>
                </div>
            </div>
            
            <div class="row justify-content-center" id="filter-controls" style="display:none;">
                <div class="col-md-6 col-lg-3 mb-2">
                    <select class="form-select bg-dark text-light border-secondary shadow-sm" id="sort-filter">
                        <option value="pop">Sort: Most Popular</option>
                        <option value="rating_desc">Sort: Highest Rating</option>
                        <option value="date_desc">Sort: Newest First</option>
                        <option value="date_asc">Sort: Oldest First</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-3 mb-2">
                    <select class="form-select bg-dark text-light border-secondary shadow-sm" id="genre-filter">
                        <option value="all">Genre: All</option>
                        <option value="28">Action</option>
                        <option value="16">Animation</option>
                        <option value="35">Comedy</option>
                        <option value="18">Drama</option>
                        <option value="27">Horror</option>
                        <option value="10749">Romance</option>
                        <option value="878">Sci-Fi</option>
                        <option value="53">Thriller</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-3 mb-2">
                    <select class="form-select bg-dark text-light border-secondary shadow-sm" id="year-filter">
                        <option value="all">Year: All</option>
                        <option value="2020">2020 & Newer</option>
                        <option value="2010">2010 - 2019</option>
                        <option value="2000">2000 - 2009</option>
                        <option value="1999">1999 & Older</option>
                    </select>
                </div>
                <div class="col-md-6 col-lg-3 mb-2">
                    <select class="form-select bg-dark text-light border-secondary shadow-sm" id="rating-filter">
                        <option value="0">Rating: All</option>
                        <option value="6">Rating: 6.0 & Above</option>
                        <option value="7">Rating: 7.0 & Above</option>
                        <option value="8">Rating: 8.0 & Above</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="status" class="text-center text-info mb-3 fw-bold"></div>

        <nav id="page-nav" class="mb-4" style="display:none;">
            <ul class="pagination justify-content-center">
                <li class="page-item"><button id="prev-page" class="page-link bg-dark text-light border-secondary">Previous</button></li>
                <li class="page-item disabled"><span class="page-link bg-primary text-light border-primary">Page <span id="current-page-num">1</span></span></li>
                <li class="page-item"><button id="next-page" class="page-link bg-dark text-light border-secondary">Next</button></li>
            </ul>
        </nav>

        <div id="details-view" class="mb-5" style="display:none;"></div>

        <div id="results-container"></div>
    </div>

    <script id="movie-grid-template" type="text/template">
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
            {{#results}}
            <div class="col">
                <div class="card h-100 bg-dark border-secondary movie-card text-white book-trigger" data-id="{{id}}">
                    <img src="{{#poster_path}}https://image.tmdb.org/t/p/w500{{poster_path}}{{/poster_path}}{{^poster_path}}https://via.placeholder.com/500x750?text=No+Poster{{/poster_path}}" class="card-img-top" alt="{{title}}">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-primary fw-bold">{{title}}</h6>
                        <p class="card-text small text-muted mt-auto mb-0">⭐ {{vote_average}}/10 | {{release_date}}</p>
                    </div>
                </div>
            </div>
            {{/results}}
        </div>
        {{^results}}
        <div class="alert alert-secondary text-center shadow">No movies found matching your filters.</div>
        {{/results}}
    </script>

    <script id="movie-table-template" type="text/template">
        {{#results.length}}
        <div class="table-responsive bg-dark rounded border border-secondary p-2 shadow">
            <table class="table table-dark table-hover table-striped align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col" style="width: 80px;">Poster</th>
                        <th scope="col">Title</th>
                        <th scope="col">Release Date</th>
                        <th scope="col">Rating</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {{#results}}
                    <tr class="book-trigger" data-id="{{id}}">
                        <td>
                            <img src="{{#poster_path}}https://image.tmdb.org/t/p/w92{{poster_path}}{{/poster_path}}{{^poster_path}}https://via.placeholder.com/92x138?text=N/A{{/poster_path}}" class="img-fluid rounded" style="width: 50px;" alt="Poster">
                        </td>
                        <td class="fw-bold text-primary">{{title}}</td>
                        <td>{{release_date}}</td>
                        <td><span class="badge bg-secondary">⭐ {{vote_average}}</span></td>
                        <td><button class="btn btn-sm btn-outline-info">Details</button></td>
                    </tr>
                    {{/results}}
                </tbody>
            </table>
        </div>
        {{/results.length}}
        {{^results.length}}
        <div class="alert alert-secondary text-center shadow">No movies found matching your filters.</div>
        {{/results.length}}
    </script>

    <script id="movie-detail-template" type="text/template">
        <div class="card bg-dark border-info shadow-lg text-light">
            <div class="row g-0">
                <div class="col-md-4 col-lg-3">
                    <img src="{{#poster_path}}https://image.tmdb.org/t/p/w500{{poster_path}}{{/poster_path}}{{^poster_path}}https://via.placeholder.com/500x750?text=No+Poster{{/poster_path}}" class="img-fluid rounded-start h-100 object-fit-cover" alt="Poster">
                </div>
                <div class="col-md-8 col-lg-9">
                    <div class="card-body position-relative">
                        <button type="button" id="close-details" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" aria-label="Close"></button>
                        <h2 class="card-title text-primary fw-bold">{{title}}</h2>
                        <h6 class="card-subtitle mb-3 text-info fst-italic">{{tagline}}</h6>
                        
                        <div class="mb-3">
                            <span class="badge bg-primary me-2">⭐ {{vote_average}}/10</span>
                            <span class="badge bg-secondary me-2">⏱️ {{runtime}} min</span>
                            <span class="badge bg-secondary">{{release_date}}</span>
                        </div>

                        <p class="card-text">{{overview}}</p>
                        
                        <div class="mt-4">
                            <strong>Genres:</strong> 
                            {{#genres}}
                            <span class="badge border border-secondary text-light me-1">{{name}}</span>
                            {{/genres}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <script>
        $(document).ready(function() {
            var tmdbKey = "62f64973d12e23168dc7804762b4e18c"; 
            var currentPage = 1;
            var currentSearchTerm = "";
            var originalData = [];
            var filteredData = [];
            var currentLayout = "grid"; 

            function renderResults() {
                var templateId = currentLayout === "grid" ? "#movie-grid-template" : "#movie-table-template";
                var rawTemplate = $(templateId).html();
                var compiledHtml = Mustache.render(rawTemplate, { results: filteredData });
                $("#results-container").html(compiledHtml);
            }

            function renderDetails(data) {
                var rawTemplate = $("#movie-detail-template").html();
                var compiledHtml = Mustache.render(rawTemplate, data);
                $("#details-view").html(compiledHtml);
                $("#details-view").fadeIn();
                $('html, body').animate({ scrollTop: $("#details-view").offset().top - 20 }, 500);
            }

            function applyFilters() {
                filteredData = [...originalData];
                
                var minRating = parseFloat($("#rating-filter").val());
                var sortType = $("#sort-filter").val();
                var genreId = $("#genre-filter").val();
                var yearRange = $("#year-filter").val();

                if (minRating > 0) {
                    filteredData = filteredData.filter(function(movie) {
                        return movie.vote_average >= minRating;
                    });
                }

                if (genreId !== "all") {
                    var gid = parseInt(genreId);
                    filteredData = filteredData.filter(function(movie) {
                        return movie.genre_ids && movie.genre_ids.includes(gid);
                    });
                }

                if (yearRange !== "all") {
                    filteredData = filteredData.filter(function(movie) {
                        if (!movie.release_date) return false;
                        var year = parseInt(movie.release_date.substring(0, 4));
                        if (yearRange === "2020") return year >= 2020;
                        if (yearRange === "2010") return year >= 2010 && year <= 2019;
                        if (yearRange === "2000") return year >= 2000 && year <= 2009;
                        if (yearRange === "1999") return year <= 1999;
                        return true;
                    });
                }

                if (sortType === "rating_desc") {
                    filteredData.sort((a, b) => b.vote_average - a.vote_average);
                } else if (sortType === "date_desc") {
                    filteredData.sort((a, b) => new Date(b.release_date) - new Date(a.release_date));
                } else if (sortType === "date_asc") {
                    filteredData.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));
                }

                renderResults();
            }

            function getMovieDetails(id) {
                $("#status").text("Loading data...");
                $.ajax({
                    url: "https://api.themoviedb.org/3/movie/" + id + "?api_key=" + tmdbKey,
                    method: 'GET',
                    success: function(response) {
                        $("#status").text("");
                        renderDetails(response);
                    }
                });
            }

            function executeSearch(page) {
                var term = $("#query").val();
                if(term === "") return;
                
                currentSearchTerm = term;
                currentPage = page;
                
                $("#status").text("Searching...");
                $("#details-view").hide();
                
                var searchUrl = "https://api.themoviedb.org/3/search/movie?api_key=" + tmdbKey + "&query=" + encodeURIComponent(term) + "&page=" + page;
                
                $.ajax({
                    url: searchUrl,
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        $("#page-nav").show();
                        $("#filter-controls").fadeIn();
                        $("#current-page-num").text(currentPage);
                        
                        $("#prev-page").parent().toggleClass("disabled", currentPage === 1);
                        
                        originalData = data.results;
                        applyFilters();
                    }
                });
            }

            function loadPopular() {
                $("#status").text("Loading popular movies...");
                $("#details-view, #page-nav").hide();
                
                $.ajax({
                    url: "https://api.themoviedb.org/3/movie/popular?api_key=" + tmdbKey + "&page=1",
                    method: 'GET',
                    success: function(data) {
                        $("#status").text("");
                        $("#filter-controls").fadeIn();
                        originalData = data.results;
                        applyFilters();
                    }
                });
            }

            $("#sort-filter, #rating-filter, #genre-filter, #year-filter").on("change", function() {
                applyFilters();
            });

            $("#exec-search").click(function() { executeSearch(1); });
            $("#query").keypress(function(e) { if(e.which == 13) executeSearch(1); });
            $("#next-page").click(function() { executeSearch(currentPage + 1); });
            $("#prev-page").click(function() { if(currentPage > 1) executeSearch(currentPage - 1); });

            $(document).on("click", ".book-trigger", function() { getMovieDetails($(this).data("id")); });
            $(document).on("click", "#close-details", function() { $("#details-view").fadeOut(); });

            $("#btn-grid").click(function() {
                currentLayout = "grid";
                $(this).removeClass("btn-outline-primary").addClass("btn-primary");
                $("#btn-list").removeClass("btn-primary").addClass("btn-outline-primary");
                renderResults();
            });

            $("#btn-list").click(function() {
                currentLayout = "list";
                $(this).removeClass("btn-outline-primary").addClass("btn-primary");
                $("#btn-grid").removeClass("btn-primary").addClass("btn-outline-primary");
                renderResults();
            });

            $("#nav-search").click(function() {
                $(this).addClass("active bg-primary").removeClass("text-light border border-secondary");
                $("#nav-shelf").removeClass("active bg-primary").addClass("text-light border border-secondary");
                
                $("#search-section").slideDown();
                $("#filter-controls").hide();
                $("#results-container").empty();
                $("#page-nav, #details-view").hide();
                $("#query").val("");
                originalData = [];
                
                $("#sort-filter").val("pop");
                $("#rating-filter").val("0");
                $("#genre-filter").val("all");
                $("#year-filter").val("all");
            });

            $("#nav-shelf").click(function() {
                $(this).addClass("active bg-primary").removeClass("text-light border border-secondary");
                $("#nav-search").removeClass("active bg-primary").addClass("text-light border border-secondary");
                
                $("#search-section").slideUp();
                
                $("#sort-filter").val("pop");
                $("#rating-filter").val("0");
                $("#genre-filter").val("all");
                $("#year-filter").val("all");
                loadPopular();
            });
        });
    </script>
</body>
</html>
