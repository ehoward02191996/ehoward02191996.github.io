<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Book View - Eric Howard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .animate-pulse-slow { animation: pulse-slow 8s infinite; }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-500/20 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-500/20 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <div class="relative z-10 p-10 max-w-5xl mx-auto flex flex-col min-h-screen">
        <a href="Project.html" class="text-purple-400 hover:text-purple-300 transition-colors mb-6 inline-block">← Back to Projects</a>
        
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent mb-10">
            Live Book Details
        </h1>

        <main class="bg-gray-900/60 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-8 md:p-12 shadow-2xl shadow-purple-500/5 flex-grow">
            <div id="book-content" class="flex flex-col md:flex-row gap-10">
                <div class="w-full md:w-1/3 flex justify-center items-start">
                    <img id="cover" src="" alt="Book Cover" class="rounded-xl shadow-lg shadow-black/50 border border-white/10 object-cover w-48 md:w-full max-w-[250px] hidden">
                    <div id="loading-spinner" class="animate-pulse w-48 h-72 bg-white/5 rounded-xl border border-white/10 flex items-center justify-center">
                        <span class="text-gray-500">Querying Google API...</span>
                    </div>
                </div>

                <div class="w-full md:w-2/3 space-y-4">
                    <h2 id="title" class="text-3xl font-bold text-white">Loading...</h2>
                    <p class="text-xl text-purple-300 font-medium italic">By <span id="author"></span></p>
                    
                    <div class="flex gap-4 text-sm text-gray-400 border-y border-white/10 py-3 my-4">
                        <p><strong class="text-gray-300">Pages:</strong> <span id="pages"></span></p>
                        <p><strong class="text-gray-300">Published:</strong> <span id="date"></span></p>
                    </div>

                    <div id="description" class="text-gray-300 leading-relaxed text-lg">
                        Fetching description from Google Books...
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-10 text-center text-gray-500 mt-auto">
            <p>© 2026 IT 4403 Course Project</p>
        </footer>
    </div>

    <script>
        $(document).ready(function() {
            // Replaced the local JSON with the live Google API endpoint
            const apiUrl = "https://www.googleapis.com/books/v1/volumes/Wfan6L9RGgYC";

            $.getJSON(apiUrl, function(data) {
                const info = data.volumeInfo;
                $("#title").text(info.title);
                $("#author").text(info.authors ? info.authors.join(", ") : "Unknown Author");
                $("#pages").text(info.pageCount);
                $("#date").text(info.publishedDate);
                $("#description").html(info.description);
                
                const imgUrl = info.imageLinks ? info.imageLinks.thumbnail : "https://via.placeholder.com/250x350?text=No+Cover";
                $("#loading-spinner").hide();
                $("#cover").attr("src", imgUrl).removeClass("hidden");
                
            }).fail(function() {
                $("#title").text("API Error");
                $("#description").text("Could not fetch data from Google Books API.");
            });
        });
    </script>
</body>
</html>
