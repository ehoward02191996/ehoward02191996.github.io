<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Book Details - Eric Howard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
        .animate-pulse-slow { animation: pulse-slow 8s infinite; }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-500/20 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-500/20 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <div class="relative z-10 p-6 md:p-10 max-w-5xl mx-auto flex flex-col min-h-screen">
        <a href="BookSearch.html" class="text-purple-400 hover:text-purple-300 transition-colors mb-6 inline-block font-medium">← Back to Search</a>
        
        <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-purple-400 to-cyan-600 bg-clip-text text-transparent mb-10">
            Live Book Details
        </h1>

        <main class="bg-gray-900/60 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-8 md:p-12 shadow-2xl shadow-purple-500/5 flex-grow">
            <div id="book-content" class="flex flex-col md:flex-row gap-10">
                
                <div class="w-full md:w-1/3 flex justify-center items-start">
                    <img id="cover" src="" alt="Book Cover" class="rounded-xl shadow-lg shadow-black/50 border border-white/10 object-cover w-48 md:w-full max-w-[250px] hidden">
                    <div id="loading-spinner" class="animate-pulse w-48 h-72 bg-white/5 rounded-xl border border-white/10 flex items-center justify-center">
                        <span class="text-gray-500">Querying Google API...</span>
                    </div>
                </div>

                <div class="w-full md:w-2/3 space-y-4">
                    <h2 id="title" class="text-3xl md:text-4xl font-bold text-white">Loading Title...</h2>
                    <p class="text-xl text-purple-300 font-medium italic">By <span id="author"></span></p>
                    
                    <div class="flex flex-wrap gap-4 text-sm text-gray-400 border-y border-white/10 py-4 my-6">
                        <p class="bg-black/30 px-3 py-1 rounded"><strong class="text-gray-300">Publisher:</strong> <span id="publisher"></span></p>
                        <p class="bg-black/30 px-3 py-1 rounded"><strong class="text-gray-300">Pages:</strong> <span id="pages"></span></p>
                        <p class="bg-black/30 px-3 py-1 rounded"><strong class="text-gray-300">Published:</strong> <span id="date"></span></p>
                    </div>

                    <div id="description" class="text-gray-300 leading-relaxed text-lg">
                        Fetching live description from Google Books...
                    </div>
                    
                    <div class="mt-8 pt-6">
                        <a id="google-link" href="#" target="_blank" class="inline-block px-6 py-3 bg-purple-600/20 border border-purple-500/50 hover:bg-purple-600/40 text-purple-300 rounded-lg font-semibold transition-colors">
                            View on Google Books ↗
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="py-10 text-center text-gray-500 mt-auto">
            <p>© 2026 IT 4403 Course Project</p>
        </footer>
    </div>

    <script>
        $(document).ready(function() {
            // 1. Check if the URL has an ID passed to it from the Search Page
            const urlParams = new URLSearchParams(window.location.search);
            let bookId = urlParams.get('id');
            
            // 2. If no ID is in the URL, default to "Lead Like a Marine"
            if (!bookId) {
                bookId = "1mIDEAAAQBAJ"; 
            }

            // 3. Query the live API for this exact book
            const apiUrl = "https://www.googleapis.com/books/v1/volumes/" + bookId;

            $.getJSON(apiUrl, function(data) {
                const info = data.volumeInfo;
                
                // Populate text fields
                $("#title").text(info.title || "No Title Available");
                $("#author").text(info.authors ? info.authors.join(", ") : "Unknown Author");
                $("#publisher").text(info.publisher || "Unknown");
                $("#pages").text(info.pageCount || "N/A");
                $("#date").text(info.publishedDate || "N/A");
                $("#description").html(info.description || "No detailed description available for this book.");
                
                // Link to actual Google Books page
                $("#google-link").attr("href", info.infoLink);
                
                // Handle high-res image if available, force HTTPS
                let imgUrl = info.imageLinks ? (info.imageLinks.medium || info.imageLinks.thumbnail) : "https://via.placeholder.com/250x350?text=No+Cover";
                imgUrl = imgUrl.replace("http:", "https:");
                
                $("#loading-spinner").hide();
                $("#cover").attr("src", imgUrl).removeClass("hidden");
                
            }).fail(function() {
                $("#title").text("API Connection Error");
                $("#description").text("Could not fetch live data from Google Books API.");
                $("#loading-spinner").hide();
            });
        });
    </script>
</body>
</html>
